name = "renaissance-hub"
main = "src/index.js"
compatibility_date = "2024-01-01"

[observability]
enabled = true
head_sampling_rate = 1

# Per-IP rate limit: 100 requests per 60s. The worker degrades gracefully
# if this binding is absent (e.g. local `wrangler dev` without support).
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 100, period = 60 }
